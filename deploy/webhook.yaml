apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: tpu-provisioner-validating-webhook
webhooks:
  - name: configmap.tpu-provisioner.google.com
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: tpu-provisioner-webhook-service
        namespace: tpu-provisioner-system
        path: "/validate-configmap"
        port: 9443
    # To secure the admission request, cert-manager or GKE automatic injection injects the CA bundle here.
    # caBundle: "..."
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: tpu-provisioner-system
    objectSelector:
      matchLabels:
        tpu-provisioner-managed: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: tpu-provisioner-webhook-service
  namespace: tpu-provisioner-system
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
  selector:
        control-plane: controller-manager
